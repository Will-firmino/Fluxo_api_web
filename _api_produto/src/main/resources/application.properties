spring.application.name=api-produto
server.port=8080

# ---------- Banco de dados de teste (H2 em memória) ----------
# Os dados existem apenas enquanto a aplicação está rodando.
spring.datasource.url=jdbc:h2:mem:produtodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria a tabela a partir da entidade Produto a cada inicialização...
spring.jpa.hibernate.ddl-auto=create-drop
# ...e só depois o data.sql é executado para inserir os produtos de exemplo.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

# Console web do H2: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:produtodb | usuário: sa | senha em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
